[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-task-artifacts"
version = "0.2.0"
description = "Small protocol package for task-scoped artifact writers."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Quantum Elements" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]
