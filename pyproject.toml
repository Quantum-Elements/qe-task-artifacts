[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-task-artifacts"
version = "0.2.0"
description = "Small protocol package for task-scoped artifact writers."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Quantum Elements" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint."messages control"]
# `format=` is part of the public ArtifactWriter API; we can't rename it.
# `...` is idiomatic in Protocol method bodies.
# `_accepts_artifacts` is an intentional cross-module marker for the
# `supports_artifacts()` detector; suppress the protected-access warning.
# Noop / accepts_artifacts wrappers intentionally ignore their arguments.
# Module/class/function docstrings are not required throughout this small
# interface package or its tests.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "redefined-builtin",
    "unnecessary-ellipsis",
    "protected-access",
    "unused-argument",
]
